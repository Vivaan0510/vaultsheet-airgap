[global]
developmentMode = false

[server]
address = "127.0.0.1"
headless = false
maxUploadSize = 500
enableCORS = true
enableXsrfProtection = true

[theme]
base = "dark"
primaryColor = "#3B82F6"          # Crisp Institutional Blue for primary buttons/accents
backgroundColor = "#0B0F19"       # Deep Slate-Navy background
secondaryBackgroundColor = "#111827" # Elevated Card & Sidebar surface
textColor = "#F9FAFB"             # Crisp off-white for zero eye strain
font = "sans serif"

[client]
toolbarMode = "minimal"           # Hides developer clutter in top-right corner
showErrorDetails = true

[browser]
gatherUsageStats = false          # Reinforces zero-telemetry guarantee
