[global]
developmentMode = false

[server]
address = "127.0.0.1"
headless = false
maxUploadSize = 500
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#38BDF8"
